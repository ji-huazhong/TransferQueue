# This is the default configuration of TransferQueue. Users may modify the default value
# and use transfer_queue.init(conf) to overwrite the config entries.

# Prometheus metrics exporter.
metrics:
  enabled: false
  # HTTP port for /metrics endpoint (0 = auto-assign free port)
  port: 0

controller:
  # User-defined sampler. User can pass sampler instance to overwrite this string config.
  sampler: SequentialSampler
  # Whether return an empty BatchMeta to prevent request blocking when no enough data is available
  polling_mode: False
  # ZMQ Server IP & Ports (automatically generated during init)
  zmq_info: null


backend:
  # Pluggable storage/transport backend of TransferQueue. Choose from:
  # SimpleStorage, Yuanrong, MooncakeStore, ...
  storage_backend: SimpleStorage

  # SimpleStorage: ZMQ-based storage for out-of-the-box usage
  SimpleStorage:
    # Maximum number of experience samples to hold across all storage units.
    # Set to null for unlimited capacity (no capacity check).
    total_storage_size: null
    # Number of distributed storage units. Units are round-robin scheduled across eligible
    # alive Ray nodes, guaranteeing an even split of memory/bandwidth usage per node.
    # Recommended: >= 2 x number of nodes so each node hosts multiple units.
    num_data_storage_units: 2
    # Optional Ray custom resource required on storage nodes. null keeps all alive nodes eligible.
    required_node_resource: null
    # Optional SSD-primary mode. SimpleStorage keeps its 2-D index and public
    # data plane while the selected backend stores batch payloads on local NVMe.
    offload:
      enabled: false
      # mooncake is the integrated production path; local_file is a dependency-free fallback.
      backend: mooncake
      # Absolute directory available at the same path on every eligible storage node.
      # Use a local NVMe filesystem rather than NFS or another shared filesystem.
      file_storage_path: /tmp/transfer_queue_simple_storage
      # SQLite page cache per storage unit. OS file cache remains reclaimable under pressure.
      memory_cache_size_bytes: 67108864
      # Per-SimpleStorage-actor Mooncake resource bounds and offload controls.
      mooncake:
        # DRAM capacity available to Mooncake payload replicas before SSD eviction.
        global_segment_size: 536870912
        # Registered transfer buffer used by the Mooncake client.
        local_buffer_size: 33554432
        # Registered buffer used by Mooncake's local SSD service.
        offload_buffer_size_bytes: 67108864
        # Large SimpleStorage batches are transparently chunked at this size.
        max_object_size_bytes: 16711680
        # Aggregate Mooncake cold-read staging requested per native call.
        get_window_size_bytes: 67108864
        heartbeat_interval_seconds: 1
        lease_ttl_ms: 500
        eviction_high_watermark_ratio: 0.8
        eviction_ratio: 0.2
        use_uring: false
        # NO_AVAILABLE_HANDLE is treated as backpressure until this deadline.
        put_timeout_seconds: 60
        retry_interval_seconds: 0.1
    # ZMQ Server IP & Ports (automatically generated during init)
    zmq_info: null

  # MooncakeStore: high-performance KV-based hierarchical storage
  # that supports RDMA transport between GPU and DRAM.
  MooncakeStore:
    # Whether TransferQueue should automatically start the Mooncake metadata server.
    # WARNING: When set to `true`, TQ will attempt to terminate any existing mooncake_master process.
    auto_init: true
    # Address of the metadata coordination server.
    # Set to "P2PHANDSHAKE" to use peer-to-peer handshake mode (recommended for multi-NIC environments).
    metadata_server: localhost:50050
    # Address of the Mooncake master server.
    master_server_address: localhost:50051
    # Local host address visible to the Mooncake cluster.
    # Set to "" to auto-detect using Ray's node IP.
    local_hostname: ""
    # Transport protocol. Choose from: tcp, rdma.
    protocol: tcp
    # Global memory segment size in bytes **per client** for mounting (default: 4GB)
    global_segment_size: 4294967296
    # Local buffer size in bytes **per client** (default: 1GB)
    local_buffer_size: 1073741824
    # Network device name.
    # Set to "" to let Mooncake auto-select available devices.
    device_name: ""
    # Whether to hard-pin objects in memory. Hard-pinned objects are never evicted.
    # Set to null (default) for auto-management: hard_pin is disabled when offload is enabled,
    # and enabled otherwise. Set to true/false to explicitly override.
    hard_pin: null

    # SSD Offload configuration.
    # When enabled, each embedded Mooncake client contributes its node-local SSD.
    # Completed memory writes are persisted asynchronously; eviction reclaims DRAM
    # after the configured high watermark is crossed.
    offload:
      # Master switch for SSD offload.
      enabled: false
      # Dedicated SSD directory on every client node. The path may be the same
      # string on all nodes when it resolves to node-local NVMe.
      file_storage_path: /tmp/mooncake_offload
      # Registered staging memory per embedded client. Include this in host-RAM
      # capacity planning together with global_segment_size and local_buffer_size.
      local_buffer_size_bytes: 268435456
      # Use Mooncake's io_uring file path when supported by the target kernel.
      use_uring: false
      # Poll the master for eager asynchronous offload work at this interval.
      heartbeat_interval_seconds: 2
      # Memory replicas remain protected for this long after PUT/GET. Mooncake
      # can reclaim them only after the lease expires. Its upstream default is 5s.
      lease_ttl_ms: 5000
      # Eviction high watermark ratio (0.0-1.0). Eviction starts when memory usage exceeds this ratio.
      eviction_high_watermark_ratio: 0.9
      # Fraction of memory to free during each eviction cycle.
      eviction_ratio: 0.1
    # Enable GPUDirect RDMA (GDR) transfer path.
    # Requires: protocol: rdma and a GDR-capable GPU
    use_gdr: false
    # Size of the pre-registered CUDA staging buffer in MB (only used when use_gdr: true).
    gdr_staging_buffer_mb: 1024

  # For Yuanrong:
  Yuanrong:
    # Whether to let TQ automatically init yuanrong
    auto_init: True
    # Datasystem worker port
    worker_port: 31501
    # Metastore service port
    metastore_port: 2379
    # Whether to enable npu transport
    enable_yr_npu_transport: false
    # Whether to enable host RDMA (H2H) transport via UCX. Requires RDMA NIC hardware and rdma-core driver.
    # See https://pages.openeuler.openatom.cn/openyuanrong-datasystem/docs/zh-cn/latest/best_practices/best_practices_for_rdma.html
    enable_rdma: false
    # UCX env vars passed to dscli subprocess. Precedence: ucx_env_vars > parent env > TQ default (UCX_TLS=rc_x when enable_rdma=true).
    #   UCX_TLS:          RDMA transport mode. "rc_x" (default when RDMA enabled and unset), "rc" (compatible), "ud" (low-latency), "dc" (large-scale).
    #   UCX_LOG_FILE:     Path to UCX log file. Requires UCX_LOG_LEVEL to be set.
    #   UCX_LOG_LEVEL:    FATAL, ERROR, WARN, INFO, DEBUG, TRACE. Use DEBUG/TRACE for troubleshooting.
    #   UCX_NET_DEVICES:  RDMA device name (e.g., mlx5_0:1). Required in multi-NIC setups.
    #   UCX_TCP_CM_ROUTE: TCP control-flow interface for UCX connection setup.
    # Example: ucx_env_vars: { UCX_TLS: rc_x, UCX_LOG_FILE: /tmp/ucx.log, UCX_LOG_LEVEL: ERROR }
    ucx_env_vars: {}
    # Additional config for yuanrong worker.
    # Recommended options for NPU environments:
    #   --remote_h2d_device_ids       Enable RH2D for efficient cross-node data transfer. Specify NPU device IDs (comma-separated).
    #   --enable_huge_tlb             Enable huge page memory to improve performance. Required for >21GB shared memory on 910B.
    #                                 Before enabling, OS config required (root privilege):
    #                                   sysctl -w vm.nr_hugepages=<count>  (each page is 2MB, e.g. 65536 for 128GB)
    #                                   ulimit -l unlimited               (allow pinning enough memory for RDMA/Ascend)
    # Example: "--shared_memory_size_mb 16384 --remote_h2d_device_ids 0,1,2,3 --enable_huge_tlb true"
    worker_args: "--shared_memory_size_mb 8192"

  # For RayStore:
  RayStore:
